# Build scripts are opt-in under pnpm 11. These three genuinely need one:
# sharp compiles its native binding, esbuild and unrs-resolver fetch a platform
# binary. Anything not listed here runs no install script.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
# pnpm holds back releases younger than its minimum age. The Payload 3.90.1 set
# is pinned deliberately and has to be exempt, or install resolves backwards.
minimumReleaseAgeExclude:
  - '@payloadcms/db-postgres@3.90.1'
  - '@payloadcms/drizzle@3.90.1'
  - '@payloadcms/graphql@3.90.1'
  - '@payloadcms/next@3.90.1'
  - '@payloadcms/plugin-cloud-storage@3.90.1'
  - '@payloadcms/richtext-lexical@3.90.1'
  - '@payloadcms/storage-s3@3.90.1'
  - '@payloadcms/translations@3.90.1'
  - '@payloadcms/ui@3.90.1'
  - payload@3.90.1
