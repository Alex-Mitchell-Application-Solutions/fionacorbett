schema: spec-driven

context: |
  fionacorbett.co.uk — a private site for Fiona Corbett's 60th birthday. Two
  features: a curated gallery of photographs spanning her life, and "memories"
  that people who are sent a link can write and optionally attach photographs to.

  Stack: TypeScript strict, Next.js 16 (App Router, Turbopack), React 19,
  Payload CMS 3.90.1 on Postgres, Tailwind v4 with a token layer, S3 for media,
  deployed to Railway from a Dockerfile.

  Read AGENTS.md before proposing anything. It is the source of truth for scope,
  standards and the delivery order, and it is swept after every shipped change.

  Two rules that catch people out here:
  - Feature code references design tokens, never a literal colour. ESLint fails
    the build on a hex literal in src/**.
  - A component is not done until it is on /design-system with every variant,
    size and state, in the same change that introduced it.

  Conventional Commits, first line only. The body carries the reasoning.

rules:
  proposal:
    - State what it costs as well as what it adds. A birthday site has a fixed
      deadline and no budget for scaffold that does not earn its place.
    - Say explicitly whether it touches the memory submission path. That path is
      the only place a stranger can write to this system and it has five layers
      in front of it; a change there needs its failure modes named.
  tasks:
    - Each task independently shippable, leaving the gate green.
    - A task that adds a component includes its showcase entry. Not a follow-up.

operations:
  apply:
    guidance:
      - Run `pnpm run ci:quality` and report the real output, including failures.
      - Verify against the running app, not only against the tests.
